name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, test, and compile
        run: npm run check

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: chicago-buoys:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Enforce runtime image size ceiling
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly maximum_bytes=100000000
          image_bytes="$(docker image inspect chicago-buoys:ci --format '{{.Size}}')"
          printf 'Runtime image size: %s bytes\n' "$image_bytes"
          if ((image_bytes > maximum_bytes)); then
            printf 'Image exceeds the %s-byte ceiling\n' "$maximum_bytes" >&2
            exit 1
          fi

      - name: Exercise compiled runtime modules
        run: >-
          docker run --rm --network none --entrypoint node chicago-buoys:ci
          --input-type=module --eval
          "if (!process.versions.node.startsWith('24.')) throw new Error('Node 24 is required');
          await import('node:sqlite');
          new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago' }).format(new Date());
          await import('./dist/src/cli.js')"
