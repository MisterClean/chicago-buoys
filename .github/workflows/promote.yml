name: Promote image to production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA already published by the candidate workflow
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/misterclean/chicago-lake-pulse

jobs:
  promote:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate commit input
        id: input
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'commit_sha must be a lowercase, full 40-character Git SHA\n' >&2
            exit 1
          fi
          printf 'source_tag=sha-%s\n' "$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and promote candidate
        id: promote
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
        run: |
          set -Eeuo pipefail
          readonly source_ref="${IMAGE_NAME}:${SOURCE_TAG}"
          readonly production_ref="${IMAGE_NAME}:production"
          docker buildx imagetools inspect "$source_ref" >/dev/null
          docker buildx imagetools create --tag "$production_ref" "$source_ref"
          digest="$({
            docker buildx imagetools inspect "$production_ref" --format '{{json .Manifest.Digest}}' |
              tr -d '"'
          })"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Registry returned an invalid production digest: %s\n' "$digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Record promotion
        shell: bash
        run: |
          {
            printf '### Production promotion\n\n'
            printf -- '- Commit: `%s`\n' '${{ inputs.commit_sha }}'
            printf -- '- Digest: `%s`\n' '${{ steps.promote.outputs.digest }}'
            printf '\nThe Lightsail deploy timer will discover this digest; publishing remains controlled by the host config.\n'
          } >> "$GITHUB_STEP_SUMMARY"
