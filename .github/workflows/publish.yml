name: Publish candidate image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/misterclean/chicago-buoys

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, test, and compile
        run: npm run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: chicago-buoys:release-check
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Enforce runtime image size ceiling
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly maximum_bytes=100000000
          image_bytes="$(docker image inspect chicago-buoys:release-check --format '{{.Size}}')"
          printf 'Runtime image size: %s bytes\n' "$image_bytes"
          if ((image_bytes > maximum_bytes)); then
            printf 'Image exceeds the %s-byte ceiling\n' "$maximum_bytes" >&2
            exit 1
          fi

      - name: Exercise compiled runtime modules
        run: >-
          docker run --rm --network none --entrypoint node chicago-buoys:release-check
          --input-type=module --eval
          "if (!process.versions.node.startsWith('24.')) throw new Error('Node 24 is required');
          await import('node:sqlite');
          new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago' }).format(new Date());
          await import('./dist/src/cli.js')"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/misterclean/chicago-buoys
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record candidate digest
        shell: bash
        run: |
          {
            printf '### Candidate image\n\n'
            printf -- '- Commit: `%s`\n' '${{ github.sha }}'
            printf -- '- Digest: `%s`\n' '${{ steps.build.outputs.digest }}'
            printf -- '- Tag: `%s:sha-%s`\n' "$IMAGE_NAME" '${{ github.sha }}'
          } >> "$GITHUB_STEP_SUMMARY"
